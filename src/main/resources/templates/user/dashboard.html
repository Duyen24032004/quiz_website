<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Dashboard</title>
</head>
<body class="bg-[#0f172a] text-white min-h-screen p-6">
  <h1 class="text-3xl font-bold mb-6">Chào mừng Username đến trang Admin</h1>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <!-- Total User -->
    <div class="bg-[#1e293b] p-6 rounded-xl shadow-lg">
      <h2 class="text-lg font-semibold">Total User</h2>
      <p class="text-2xl font-bold mt-2">300</p>
      <div class="w-full bg-gray-700 rounded-full h-2 mt-2">
        <div class="bg-green-500 h-2 rounded-full" style="width: 30%"></div>
      </div>
    </div>

    <!-- Total Quiz -->
    <div class="bg-[#1e293b] p-6 rounded-xl shadow-lg">
      <h2 class="text-lg font-semibold">Total Quiz</h2>
      <p class="text-2xl font-bold mt-2">3000</p>
      <div class="w-full bg-gray-700 rounded-full h-2 mt-2">
        <div class="bg-red-500 h-2 rounded-full" style="width: 15%"></div>
      </div>
    </div>
  </div>
</body>
</html>
