<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Thêm tài khoản</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-8">
  <div class="max-w-xl mx-auto bg-gray-800 p-6 rounded-lg shadow-lg">
    <h2 class="text-2xl font-semibold mb-6">➕ Thêm tài khoản mới</h2>

    <form action="#" method="post" class="space-y-4">
      <div>
        <label for="name" class="block mb-1">Tên tài khoản</label>
        <input type="text" id="name" name="name" required
               class="w-full p-2 rounded bg-gray-700 text-white" />
      </div>

      <div>
        <label for="email" class="block mb-1">Email</label>
        <input type="email" id="email" name="email" required
               class="w-full p-2 rounded bg-gray-700 text-white" />
      </div>

      <div>
        <label for="password" class="block mb-1">Mật khẩu</label>
        <input type="password" id="password" name="password" required
               class="w-full p-2 rounded bg-gray-700 text-white" />
      </div>

      <div>
        <label for="role" class="block mb-1">Vai trò</label>
        <select id="role" name="role" required
                class="w-full p-2 rounded bg-gray-700 text-white">
          <option value="">-- Chọn vai trò --</option>
          <option value="USER">User</option>
          <option value="ADMIN">Admin</option>
        </select>
      </div>

      <div class="flex justify-end gap-2">
        <a href="account-management.html"
           class="px-4 py-2 bg-gray-600 hover:bg-gray-500 rounded text-white transition">
          Quay lại
        </a>
        <button type="submit"
                class="px-4 py-2 bg-green-500 hover:bg-green-400 rounded text-white font-medium transition">
          Lưu tài khoản
        </button>
      </div>
    </form>
  </div>
</body>
</html>
