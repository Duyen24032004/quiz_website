<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thêm câu hỏi - QuizArcade</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex">

  <!-- Sidebar
  <aside class="w-64 bg-gray-800 flex flex-col p-4 space-y-6">
    <div class="text-2xl font-bold text-white">🎮 QuizArcade</div>
    <nav class="flex flex-col space-y-2">
      <a href="#" class="text-left text-gray-300 hover:text-white">🏠 Dashboard</a>
      <a href="#" class="text-left text-gray-300 hover:text-white">👤 Quản lý tài khoản</a>
      <a href="#" class="text-left text-gray-300 hover:text-white">📝 Quản lý Quiz</a>

    </nav>
  </aside> -->

  <!-- Main Content -->
  <main class="flex-1 p-8 overflow-y-auto">
    <h2 class="text-2xl font-semibold mb-4">📌 Thêm câu hỏi</h2>
    <form id="questionForm" class="space-y-6">
      <!-- JavaScript sẽ thêm các nhóm câu hỏi ở đây -->
      <div id="questionsContainer" class="space-y-6"></div>
      <button type="submit" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded">Lưu tất cả câu hỏi</button>
    </form>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const soLuong = parseInt(urlParams.get('soLuong')) || 1;

    const container = document.getElementById('questionsContainer');

    for (let i = 1; i <= soLuong; i++) {
      container.innerHTML += `
        <div class="border border-gray-600 p-4 rounded space-y-2">
          <h3 class="font-bold">Câu hỏi ${i}</h3>
          <input type="text" placeholder="Nội dung câu hỏi" class="w-full p-2 rounded bg-gray-700 text-white" required />
          <div class="grid grid-cols-2 gap-2">
            <input type="text" placeholder="Đáp án A" class="p-2 rounded bg-gray-700 text-white" required />
            <input type="text" placeholder="Đáp án B" class="p-2 rounded bg-gray-700 text-white" required />
            <input type="text" placeholder="Đáp án C" class="p-2 rounded bg-gray-700 text-white" required />
            <input type="text" placeholder="Đáp án D" class="p-2 rounded bg-gray-700 text-white" required />
          </div>
          <select class="w-full p-2 rounded bg-gray-700 text-white" required>
            <option value="">Chọn đáp án đúng</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
          </select>
        </div>
      `;
    }
  </script>
</body>
</html>
