<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - QuizArcade</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex">

  <!-- Sidebar -->
  <aside class="w-64 bg-gray-800 flex flex-col p-4 space-y-6">
    <div class="text-2xl font-bold text-white">🎮 QuizArcade</div>
    <nav class="flex flex-col space-y-2">
      <button onclick="loadPage('dashboard.html')" class="text-left text-gray-300 hover:text-white">🏠 Trang chủ</button>
      <button onclick="loadPage('account-management.html')" class="text-left text-gray-300 hover:text-white">👤 Quản lý tài khoản</button>
            <button onclick="loadPage('quiz-management.html')" class="text-left text-gray-300 hover:text-white">📝 Quản lý Quiz</button>
      <button onclick="loadPage('create-quiz.html')" class="text-left text-gray-300 hover:text-white">➕ Tạo Quiz</button>

      <a href="logout.html" class="text-red-400 hover:text-red-200">🔓 Đăng xuất</a>
    </nav>
  </aside>

  <!-- Main Content via iframe -->
  <main class="flex-1 p-4">
    <iframe id="mainFrame" src="dashboard.html" class="w-full h-screen rounded-xl" frameborder="0"></iframe>
  </main>

  <script>
    function loadPage(page) {
      document.getElementById('mainFrame').src = page;
    }
  </script>
</body>
</html>
